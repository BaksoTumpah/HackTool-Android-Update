name: Build APK

on:
  workflow_dispatch:            # tombol "Run workflow" manual di tab Actions
  push:
    branches: [ main, master ]
    paths:
      - 'www/**'
      - 'android-res/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependency
        run: npm install

      - name: Buat project Android native
        run: npx cap add android

      - name: Pasang ikon aplikasi
        run: cp -r android-res/. android/app/src/main/res/

      - name: Tambah izin getar (VIBRATE)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.VIBRATE' "$M" || \
            sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.VIBRATE" />#' "$M"
          grep 'android.permission.VIBRATE' "$M"

      - name: Sync web ke Android
        run: npx cap sync android

      - name: Build APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HackTool-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
